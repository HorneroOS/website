name: product-data

# Moves the product-data pins (src/data/product/pins.json) to the current
# shell/config/hornero mains, regenerates the data and opens a pull request.
# Nothing reaches the site without review.
#
# A pull request created with GITHUB_TOKEN does not trigger other
# workflows, so after opening/updating the PR this workflow dispatches
# the build, lint and governance workflows onto the bot branch; their
# status contexts report on the PR head commit like any human PR.

"on":
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: product-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # yamllint disable rule:line-length
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      # yamllint enable rule:line-length
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Bump pins and regenerate
        run: npm run data:bump
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/product; then
            echo "product data already current"
            exit 0
          fi
          branch=chore/product-data-refresh
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add src/data/product
          git commit -m "chore(data): refresh product data from current mains"
          # Fetch the advertised head before using a lease. Without this,
          # an existing PR branch has no local tracking ref and the first
          # refresh after opening that PR is rejected as stale information.
          if git ls-remote --exit-code --heads origin \
            "$branch" > /dev/null; then
            git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            expected=$(git rev-parse "refs/remotes/origin/$branch")
            git push \
              --force-with-lease="refs/heads/$branch:$expected" \
              origin "$branch"
          else
            git push origin "$branch"
          fi
          # Only an OPEN PR counts: `gh pr view <branch>` also resolves
          # merged/closed PRs that once used this head, which made every
          # later refresh silently skip PR creation and gate dispatch.
          open_pr=$(gh pr list --head "$branch" --state open \
            --json number -q '.[0].number // empty')
          if [ -z "$open_pr" ]; then
            pr_body='Automated source and product data refresh; '
            pr_body+='review before merging.'
            if ! gh pr create --head "$branch" --base main \
              --title "chore(data): refresh product data from current mains" \
              --body "$pr_body"; then
              warning="Updated $branch, but repository policy blocks Actions "
              warning+="from opening PRs; open the branch for review manually."
              echo "::warning::$warning"
              exit 0
            fi
          fi
          # Bot-created PRs do not trigger pull_request workflows;
          # dispatch the gate workflows onto the branch so their
          # required contexts report on the PR head commit.
          for wf in build.yml lint.yml pr-governance.yml; do
            gh workflow run "$wf" --ref "$branch"
          done
