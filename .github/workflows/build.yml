name: build

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1, pinned to its verified release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v7.1.0, pinned to its verified release commit.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Product data matches its pins
        run: npm run data:check
      - run: npm run lint
      # `astro check` prints an error and exits 0 when @astrojs/check cannot be
      # loaded, so prove the checker imports before trusting its exit code.
      - name: Verify astro check toolchain loads
        run: node --input-type=module -e "await import('@astrojs/check')"
      - run: npm run type-check
      - run: npm run build
