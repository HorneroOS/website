      - heading [level=1] [ref=e68]:
        - text: One system.
        - emphasis [ref=e69]: Four ways to use it.
      - paragraph [ref=e70]: HorneroOS is composed from a shared base and focused capabilities. Desktop, Server, Agents and Studio are connected profiles, not separate distributions maintained in parallel.
      - paragraph [ref=e71]:
        - text: The product model is defined; maturity varies by profile. A provisional Calamares installer is in development, but its install flow has not passed virtual-machine acceptance and no ISO is published.
