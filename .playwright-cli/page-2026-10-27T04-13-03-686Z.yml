    - region [ref=e263]:
      - generic [ref=e264]:
        - heading "Historia, con fuentes" [level=2] [ref=e265]
        - paragraph [ref=e266]: Hornero empezó como el escritorio diario de una persona y después se convirtió en proyectos separados. Cada paso posterior al primero enlaza al commit o tag que lo fecha. El primer paso es anterior a la historia pública y se basa en el relato de su maintainer.
      - region "Línea de tiempo de HorneroOS, 2018 a 2026" [ref=e267]:
        - list [ref=e268]:
          - listitem [ref=e269]:
            - time [ref=e270]: "2018"
            - heading "A personal Arch Linux workstation" [level=3] [ref=e271]
            - paragraph [ref=e272]: Hornero starts as one developer’s daily desktop in Argentina. This stage predates the public repository history below, so it rests on the maintainer’s account.
            - generic [ref=e273]: Relato del maintainer · ningún commit público es anterior a 2019
          - listitem [ref=e274]:
            - time [ref=e275]: 2019.11.02
            - heading "The configuration goes public" [level=3] [ref=e276]
            - paragraph [ref=e277]: "The first public commit of the dotfiles that became HorneroConfig: an i3 setup, followed the same day by Polybar."
            - link "First commit in ulises-jeremias/dotfiles" [ref=e278] [cursor=pointer]:
              - /url: https://github.com/ulises-jeremias/dotfiles/commit/40480e3419b62fedd2f41fcb649fd3df30ac1ab7
              - text: First commit in ulises-jeremias/dotfiles ↗
          - listitem [ref=e279]:
            - time [ref=e280]: 2026.02.27
            - heading "The shell becomes Quickshell" [level=3] [ref=e281]
            - paragraph [ref=e282]: The workstation switches its bars and panels to a Quickshell shell adapted from Caelestia Shell. That is a new chapter, not the 2018 setup unchanged.
            - link "Transition to Quickshell in dotfiles" [ref=e283] [cursor=pointer]:
              - /url: https://github.com/ulises-jeremias/dotfiles/commit/4f53f3e41cd47aeeb3235224ab922c092c856a22
              - text: Transition to Quickshell in dotfiles ↗
          - listitem [ref=e284]:
            - time [ref=e285]: 2026.09.10
            - heading "HorneroOS gets its own repositories" [level=3] [ref=e286]
            - paragraph [ref=e287]: The shell is imported from dotfiles into HorneroOS/shell with the upstream author, license and every header intact, then stripped of workstation-only paths.
            - link "Shell import, with the Caelestia NOTICE" [ref=e288] [cursor=pointer]:
              - /url: https://github.com/HorneroOS/shell/commit/5830eab60f913668b07e6314f5051b8957a2cd71
              - text: Shell import, with the Caelestia NOTICE ↗
          - listitem [ref=e289]:
            - time [ref=e290]: 2026.09.10
            - heading "horneroctl, the native system CLI" [level=3] [ref=e291]
            - paragraph [ref=e292]: A command-line core written in V becomes the operating-system contract. The shell calls its verbs instead of workstation scripts from 2026-09-29.
            - link "horneroctl core in HorneroOS/hornero" [ref=e293] [cursor=pointer]:
              - /url: https://github.com/HorneroOS/hornero/commit/45876631e2abb3180aa648ab1d425b4594b4deb9
              - text: horneroctl core in HorneroOS/hornero ↗
          - listitem [ref=e294]:
            - time [ref=e295]: 2026.10.01
            - heading "A QA repository records evidence" [level=3] [ref=e296]
            - paragraph [ref=e297]: HorneroOS/qa boots virtual machines, drives scenarios and keeps screenshots with hashes and the pinned product revisions.
            - link "Bootstrap of HorneroOS/qa" [ref=e298] [cursor=pointer]:
              - /url: https://github.com/HorneroOS/qa/commit/447f5b4e367dcb153215630e6669e4983da39473
              - text: Bootstrap of HorneroOS/qa ↗
          - listitem [ref=e299]:
            - time [ref=e300]: 2026.10.20
            - heading "An official extensions catalogue" [level=3] [ref=e301]
            - paragraph [ref=e302]: Official plugins get a catalogue with checksums and declared permissions. Community packages stay inert.
            - link "Marketplace foundation in HorneroOS/plugins" [ref=e303] [cursor=pointer]:
              - /url: https://github.com/HorneroOS/plugins/commit/4a17b450dbd01d15ecf16fc06608c69af704aaa5
              - text: Marketplace foundation in HorneroOS/plugins ↗
