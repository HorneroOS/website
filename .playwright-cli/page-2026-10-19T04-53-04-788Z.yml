      - paragraph [ref=e131]: Shared architecture
      - heading "Capabilities compose. Product truth stays together." [level=2] [ref=e132]
      - paragraph [ref=e133]: Studio builds on Desktop; Agents builds on Server. The compositor belongs to Desktop as a backend choice. Hyprland is the validated default, while Niri is experimental and retains clearly documented capability gaps.
      - paragraph [ref=e134]: The edition and compositor states on this page come from the pinned Hornero composition catalogue. The same model is designed for CLI introspection, installation and acceptance tooling; those image and installer paths are not yet released.
