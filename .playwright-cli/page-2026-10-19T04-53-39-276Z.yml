      - article [ref=e143]:
        - generic "Featured tools on this page" [ref=e144]:
          - generic [ref=e145]: Featured tools
          - list [ref=e146]:
            - listitem [ref=e147]:
              - generic [ref=e148]: Yazi
            - listitem [ref=e149]:
              - generic [ref=e150]: Thunar
        - heading "Files and folders" [level=1] [ref=e151]
        - paragraph [ref=e152]: Hornero supports a graphical file manager and a terminal file browser. They serve different tasks and share the same files on disk.
        - heading "Thunar for visual file management" [level=2] [ref=e153]
        - paragraph [ref=e154]:
          - text: Press
          - strong [ref=e155]: Super + F
          - text: to open the host’s XDG
          - code [ref=e156]: FileManager
          - text: association through
          - code [ref=e157]: exo-open
          - text: . Thunar is the curated graphical file manager in Hornero Config and has defaults for accelerators, bulk rename, and two useful custom actions. User configuration lives under
          - code [ref=e158]: ~/.config/Thunar/
          - text: ; package-wide defaults are under
          - code [ref=e159]: /etc/xdg/Thunar/
          - text: . The
          - code [ref=e160]: hornero-config
          - text: package does not install
          - code [ref=e161]: uca.xml
          - text: to the system path because Thunar owns that file; a user materialization can still supply the actions in the user’s config.
        - paragraph [ref=e162]:
          - text: When the configured session starts, it asks Thunar’s daemon to stay ready so later windows open faster. The context menu actions
          - strong [ref=e163]: Open in Yazi
          - text: and
          - strong [ref=e164]: Open Terminal Here
          - text: use the selected terminal association;
          - strong [ref=e165]: Open in Yazi
          - text: also needs Yazi installed. These are integrated workflows, not bundled archive or terminal programs.
        - paragraph [ref=e166]:
          - text: "Upstream:"
          - link "Thunar documentation" [ref=e167] [cursor=pointer]:
            - /url: https://docs.xfce.org/xfce/thunar/start
          - text: .
        - paragraph [ref=e168]:
          - text: The sample below shows several distinct Hornero wallpaper directions, including Patagonia, Fin del Mundo, Neon City, Vapor Dreams, and Soft Morning. The sample files are public wallpaper assets from the
          - link "dotfiles repository" [ref=e169] [cursor=pointer]:
            - /url: https://github.com/ulises-jeremias/dotfiles
          - text: ", not a claim that Thunar or these wallpapers are part of the Hornero base package."
        - paragraph [ref=e170]:
          - img "Thunar shows a mixed-color Hornero wallpaper folder with Patagonia, Beagle Channel, Neon City, Vapor Dreams, and Morning Lake thumbnails." [ref=e171]
        - heading "Yazi for keyboard-driven browsing" [level=2] [ref=e172]
        - paragraph [ref=e173]:
          - text: Press
          - strong [ref=e174]: Super + E
          - text: to open Yazi in a window from the configured terminal and restore its last directory. The initial Hornero default is Kitty. Choose Alacritty or Ghostty as the terminal and the same workflow follows that selection. From inside an existing terminal,
          - code [ref=e175]: horneroctl apps terminal-file
          - text: opens Yazi in the current window; use
          - code [ref=e176]: "--new-window"
          - text: "for a separate terminal window. The CLI can also open a directory or select a file:"
        - code [ref=e178]:
          - generic [ref=e179]: horneroctl apps terminal-file --help
          - generic [ref=e180]: horneroctl apps terminal-file --cheatsheet
          - generic [ref=e181]: horneroctl apps terminal-file --path ~/Downloads
          - generic [ref=e182]: horneroctl apps terminal-file --new-window --path ~/Downloads
        - paragraph [ref=e183]:
          - text: Hornero Config does not declare Yazi as a dependency. The configured terminal and Yazi must both be installed for this workflow. Change the terminal with
          - link [ref=e184] [cursor=pointer]:
            - /url: /docs/applications/default-apps/
            - code [ref=e185]: horneroctl config default-apps
          - text: . The public
          - link "dotfiles repository" [ref=e186] [cursor=pointer]:
            - /url: https://github.com/ulises-jeremias/dotfiles
          - text: can install Yazi and preview helpers for a personal Arch workstation; these are not dependencies of the Hornero release composition.
        - paragraph [ref=e187]:
          - text: Yazi keybindings can be queried from the Hornero CLI cheatsheet. In the personal configuration,
          - code [ref=e188]: ~/.config/yazi/yazi.toml
          - text: ","
          - code [ref=e189]: keymap.toml
          - text: ", and"
          - code [ref=e190]: theme.toml
          - text: set file openers, extra key bindings, and terminal colors. That profile adds
          - code [ref=e191]: g
          - text: directory shortcuts,
          - code [ref=e192]: D D
          - text: to move items to trash, and
          - code [ref=e193]: Alt + T
          - text: to open a selection in Thunar. Preview support depends on optional host tools such as
          - code [ref=e194]: ffmpegthumbnailer
          - text: ","
          - code [ref=e195]: poppler
          - text: ", and ImageMagick; a missing preview does not mean the file is missing. Yazi upstream:"
          - link "documentation" [ref=e196] [cursor=pointer]:
            - /url: https://yazi-rs.github.io/docs/
          - text: .
        - paragraph [ref=e197]:
          - img "Yazi previews a Beagle Channel dusk wallpaper beside a keyboard-driven file list that includes Patagonia, Neon City, Vapor Dreams, and Morning Lake." [ref=e198]
        - heading "File opening and archives" [level=2] [ref=e199]
        - paragraph [ref=e200]:
          - code [ref=e201]: exo-open
          - text: launches the default file manager and terminal.
          - code [ref=e202]: handlr
          - text: and
          - code [ref=e203]: xdg-mime
          - text: resolve MIME associations, such as which app opens a PDF or image. Thunar delegates archive operations to compatible utilities and plugins installed on the host; Xarchiver is one optional personal workstation choice. Yazi can list and extract archives when the relevant preview and archive tools are available. Hornero Config does not download missing helpers.
        - paragraph [ref=e204]: "Inspect the current directory handler with:"
        - code [ref=e206]:
          - generic [ref=e207]: horneroctl apps files --info
          - generic [ref=e208]: horneroctl config default-apps list
        - paragraph [ref=e209]:
          - text: Change a file association using the instructions in
          - link "Default applications" [ref=e210] [cursor=pointer]:
            - /url: /docs/applications/default-apps/
          - text: . Hornero does not install or silently download archive or preview dependencies.
        - paragraph [ref=e212]:
          - text: From
          - link [ref=e213] [cursor=pointer]:
            - /url: https://github.com/HorneroOS/docs/blob/71a03191b6e1d4d82796ea24fdff18af87ec519a/applications/files.md
            - code [ref=e214]: HorneroOS/docs/applications/files.md
          - text: at commit
          - link [ref=e215] [cursor=pointer]:
            - /url: https://github.com/HorneroOS/docs/commit/71a03191b6e1d4d82796ea24fdff18af87ec519a
            - code [ref=e216]: 71a0319
          - text: .
          - link "Suggest a change on GitHub" [ref=e217] [cursor=pointer]:
            - /url: https://github.com/HorneroOS/docs/edit/main/applications/files.md
          - text: .
