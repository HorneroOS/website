    - region [ref=f1e510]:
      - heading "Audio and performance modes" [level=2] [ref=f1e511]
      - paragraph [ref=f1e512]: "Studio audio modes are reversible and owned by one contract: Balanced keeps device defaults; the others are explicit opt-ins, and the previous state is recorded so it can be restored exactly. Quantum is a scheduling period, not a measured round-trip latency, and no mode forces realtime kernels, IRQ tuning or privilege changes."
      - list [ref=f1e513]:
        - listitem [ref=f1e514]:
          - strong [ref=f1e515]: Balanced
          - generic [ref=f1e516]: Default — device rate and quantum.
          - generic [ref=f1e517]: Default
