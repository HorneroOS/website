    - paragraph [ref=f1e586]:
      - text: The desktop behind HorneroOS has been in daily use since 2018, by the maintainer’s account (
      - link "history" [ref=f1e587] [cursor=pointer]:
        - /url: /en/roots#timeline
      - text: ), and its configuration has been public since 2019 (
      - link "first commit" [ref=f1e588] [cursor=pointer]:
        - /url: https://github.com/ulises-jeremias/dotfiles/commit/40480e3419b62fedd2f41fcb649fd3df30ac1ab7
      - text: "). Hornero 199X is an art direction: a future imagined in Argentina in the 1990s, drawn with today’s open-source tools. It is not a historical product. This site sets no cookies, runs no analytics and loads no third-party resources. Your color choice stays in this browser. So does your language choice. Every screenshot is labelled with its source."