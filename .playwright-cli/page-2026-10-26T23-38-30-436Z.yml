  - main [ref=f1e83]:
    - generic [ref=f1e84]:
      - paragraph [ref=f1e85]:
        - strong [ref=f1e86]: Ficha técnica · Edición Studio
        - generic [ref=f1e87]: ARG / 199X
        - generic [ref=f1e88]: "Estado: Preview"
      - heading "Studio" [level=1] [ref=f1e89]
      - paragraph [ref=f1e90]: HorneroOS Studio is a Preview creative edition built on the Desktop, and it installs today from the HorneroOS Preview ISO. You pick specializations (audio, video, streaming, design, photography, 3D) and the system sets up the applications, audio policy and workspace for them.
      - generic "Flagship Studio applications" [ref=f1e91]:
        - generic [ref=f1e92]: Ardour
        - generic [ref=f1e94]: OBS Studio
        - generic [ref=f1e96]: Blender
        - generic [ref=f1e98]: Krita
        - generic [ref=f1e100]: Godot
      - generic [ref=f1e102]:
        - generic [ref=f1e103]:
          - term [ref=f1e104]: specializations in the catalogue
          - definition [ref=f1e105]: "10"
        - generic [ref=f1e106]:
          - term [ref=f1e107]: applications in the catalogue
          - definition [ref=f1e108]: "19"
        - generic [ref=f1e109]:
          - term [ref=f1e110]: audio modes, all reversible
          - definition [ref=f1e111]: "3"
      - note [ref=f1e112]:
        - strong [ref=f1e113]: Studio is available now as a Preview.
        - text: It installs from the same signed Preview ISO as Desktop, with installer-time specialization selection, and its install matrix (UEFI/BIOS, encrypted and unencrypted) was executed in disposable virtual machines with
        - code [ref=f1e114]: horneroctl studio doctor
        - text: "green. That is VM evidence only: first-login and package-parity records remain partial in the installer's R11 record. See"
        - link "Install" [ref=f1e115] [cursor=pointer]:
          - /url: /en/install
        - text: to download it. Physical-hardware validation (audio interfaces, MIDI, GPU encode) is still pending, so Studio is Preview, not Supported.
