      - article [ref=e143]:
        - generic "Featured tools on this page" [ref=e144]:
          - generic [ref=e145]: Featured tools
          - list [ref=e146]:
            - listitem [ref=e147]:
              - generic [ref=e148]: Kitty
            - listitem [ref=e149]:
              - generic [ref=e150]: Alacritty
            - listitem [ref=e151]:
              - generic [ref=e152]: Ghostty
        - heading "Terminal and shell" [level=1] [ref=e153]
        - paragraph [ref=e154]:
          - text: Hornero separates the terminal window, the interactive shell inside it, and the command-line tools that manage the desktop. Kitty is the selected default terminal when installed; Alacritty and Ghostty are optional alternatives with their own Hornero defaults. The terminal applications are separate host packages, not dependencies of the Shell.
          - strong [ref=e155]: Super + E
          - text: opens Yazi in the host’s configured terminal, while regular terminal launches follow that same association.
        - heading "Open a terminal" [level=2] [ref=e156]
        - list [ref=e157]:
          - listitem [ref=e158]:
            - text: Press
            - strong [ref=e159]: Super + T
            - text: or
            - strong [ref=e160]: Super + Enter
            - text: to open the host’s XDG
            - code [ref=e161]: TerminalEmulator
            - text: association through
            - code [ref=e162]: exo-open
            - text: .
          - listitem [ref=e163]:
            - text: Open the Launcher with
            - strong [ref=e164]: Ctrl + Space
            - text: and search for an installed terminal.
          - listitem [ref=e165]:
            - text: Press
            - strong [ref=e166]: Super + E
            - text: for Yazi in a separate window from the configured terminal. Hornero selects Kitty by default; Alacritty and Ghostty are also supported. This workflow needs the selected terminal and Yazi.
        - paragraph [ref=e167]:
          - text: Choose an installed terminal in
          - strong [ref=e168]: Settings → Terminal
          - text: . Hornero keeps the selection aligned across the host’s Xfce helper, XDG preference, and Shell launch actions. You can inspect it with
          - code [ref=e169]: horneroctl config default-apps list
          - text: "or change it from the CLI. Preview the change first:"
        - code [ref=e171]:
          - generic [ref=e172]: horneroctl config default-apps set terminal ghostty --dry-run
          - generic [ref=e173]: horneroctl config default-apps set terminal ghostty --yes
        - paragraph [ref=e174]:
          - text: Supported targets are Kitty, Alacritty, and Ghostty. The command updates the user’s
          - code [ref=e175]: $XDG_CONFIG_HOME/xfce4/helpers.rc
          - text: and generic
          - code [ref=e176]: $XDG_CONFIG_HOME/xdg-terminals.list
          - text: (or the equivalent paths under
          - code [ref=e177]: ~/.config
          - text: ), while leaving MIME defaults and other helper entries alone. It also removes a fallback exclusion for the selected terminal. When installed,
          - code [ref=e178]: xdg-terminal-exec
          - text: reads the generic list; a desktop-specific preference file can take precedence. See
          - link "Default applications" [ref=e179] [cursor=pointer]:
            - /url: /docs/applications/default-apps/
          - text: and
          - link "keyboard shortcuts" [ref=e180] [cursor=pointer]:
            - /url: /docs/desktop/shortcuts/
          - text: .
        - heading "Kitty" [level=2] [ref=e181]
        - paragraph [ref=e182]:
          - text: Kitty is a GPU-accelerated terminal emulator. Hornero Config provides its system defaults under
          - code [ref=e183]: /etc/xdg/kitty
          - text: ; your user configuration at
          - code [ref=e184]: ~/.config/kitty/kitty.conf
          - text: "can override them. The defaults include a Hornero Dark palette, font and window spacing, scrollback, and copy/paste bindings:"
        - table [ref=e185]:
          - rowgroup [ref=e186]:
            - row [ref=e187]:
              - columnheader "Key" [ref=e188]
              - columnheader "Action" [ref=e189]
          - rowgroup [ref=e190]:
            - row [ref=e191]:
              - cell [ref=e192]:
                - code [ref=e193]: Ctrl + Shift + C
              - cell "Copy selection" [ref=e194]
            - row [ref=e195]:
              - cell [ref=e196]:
                - code [ref=e197]: Ctrl + Shift + V
              - cell "Paste" [ref=e198]
            - row [ref=e199]:
              - cell [ref=e200]:
                - code [ref=e201]: Ctrl + Shift + Page Up/Down
              - cell "Scroll one line" [ref=e202]
            - row [ref=e203]:
              - cell [ref=e204]:
                - code [ref=e205]: Ctrl + Shift + Home/End
              - cell "Scroll to top / bottom" [ref=e206]
            - row [ref=e207]:
              - cell [ref=e208]:
                - code [ref=e209]: Ctrl + L
              - cell "Clear the visible screen" [ref=e210]
        - paragraph [ref=e211]:
          - text: The screenshot shows Kitty running
          - code [ref=e212]: horneroctl
          - text: appearance commands with the current host configuration. Theme IDs shown by a specific machine can differ from a later catalogue pin.
        - paragraph [ref=e213]:
          - img "Kitty displays Hornero theme IDs and wallpaper-derived color information in a styled terminal window." [ref=e214]
        - paragraph [ref=e215]:
          - text: Theme packs provide Hornero Dark, Light, and Pampa palettes. Wallpaper-derived colors can also write a user overlay under
          - code [ref=e216]: ~/.cache/hornero/smart-colors/colors-kitty.conf
          - text: . If Kitty reports that the optional overlay is absent, the packaged palette still works; generate colors from Appearance or remove only the stale include in a user override.
        - paragraph [ref=e217]:
          - text: The public
          - link "dotfiles repository" [ref=e218] [cursor=pointer]:
            - /url: https://github.com/ulises-jeremias/dotfiles
          - text: adds a personal Kitty setup with an 80×24 initial window, 12-point font, and 80% background opacity. Those are workstation preferences, not a Hornero release requirement. Edit the active
          - code [ref=e219]: kitty.conf
          - text: to customize Kitty. See the
          - link "Kitty manual" [ref=e220] [cursor=pointer]:
            - /url: https://sw.kovidgoyal.net/kitty/
          - text: .
        - heading "Alacritty" [level=2] [ref=e221]
        - paragraph [ref=e222]:
          - text: Alacritty is an optional terminal for users who prefer a compact TOML configuration. When Alacritty is installed, Hornero Config supplies a system fallback at
          - code [ref=e223]: /etc/alacritty/alacritty.toml
          - text: . It imports the static Hornero Dark palette and an optional generated palette, and enables live config reload. Hornero writes the active wallpaper-derived colors to
          - code [ref=e224]: ~/.config/alacritty/hornero-colors.toml
          - text: ; applying an appearance updates this file. If you maintain a user config at
          - code [ref=e225]: ~/.config/alacritty/alacritty.toml
          - text: ", include the Hornero palette imports there to keep generated colors active."
        - paragraph [ref=e226]:
          - text: The installed default uses 12-pixel window padding, 88% opacity, a 2,500-line scrollback, and a non-blinking block cursor. The
          - link "Alacritty configuration reference" [ref=e227] [cursor=pointer]:
            - /url: https://alacritty.org/config-alacritty.html
          - text: documents TOML imports and other settings.
        - heading "Ghostty" [level=2] [ref=e228]
        - paragraph [ref=e229]:
          - text: Ghostty is another optional terminal. Hornero Config provides a
          - code [ref=e230]: Hornero Dynamic
          - text: fallback theme under
          - code [ref=e231]: /usr/share/ghostty/themes/
          - text: and seeds
          - code [ref=e232]: /etc/skel/.config/ghostty/config.ghostty
          - text: for newly created accounts. That config selects the Hornero theme and sets 88% background opacity. Existing accounts are not overwritten by the skeleton; add
          - code [ref=e233]: theme = Hornero Dynamic
          - text: to your own
          - code [ref=e234]: ~/.config/ghostty/config.ghostty
          - text: to opt in.
        - paragraph [ref=e235]:
          - text: When an appearance is applied, Hornero writes the wallpaper-derived theme to
          - code [ref=e236]: ~/.config/ghostty/themes/Hornero Dynamic
          - text: ", which takes precedence over the system fallback, and signals a running Ghostty instance to reload. Keep the theme name stable in your config so subsequent appearances update it. See Ghostty’s"
          - link "configuration guide" [ref=e237] [cursor=pointer]:
            - /url: https://ghostty.org/docs/config
          - text: and
          - link "color-theme guide" [ref=e238] [cursor=pointer]:
            - /url: https://ghostty.org/docs/features/theme
          - text: .
        - heading "Shared appearance behavior" [level=2] [ref=e239]
        - paragraph [ref=e240]:
          - text: Applying an appearance in Hornero updates the generated palette files for Kitty, Alacritty, and Ghostty from the active wallpaper. Each emulator reads its native format. Kitty and Alacritty have static Hornero Dark / Light fallbacks; Ghostty has a static
          - code [ref=e241]: Hornero Dynamic
          - text: theme fallback. These keep the terminals usable before palette generation, while user-level files remain yours to customize. To inspect the generated scheme, run
          - code [ref=e242]: horneroctl appearance colors status
          - text: . See
          - link "Appearance" [ref=e243] [cursor=pointer]:
            - /url: /docs/desktop/appearance/
          - text: for theme and palette controls.
        - heading "Shell and command workflow" [level=2] [ref=e244]
        - paragraph [ref=e245]:
          - text: Your account’s configured shell runs inside the terminal. Hornero Config does not make Zsh, a prompt, shell plugins, or aliases a system dependency. The public dotfiles configuration optionally installs Zsh and defines a personal profile in
          - code [ref=e246]: ~/.zshrc
          - text: ","
          - code [ref=e247]: ~/.zsh/config.d/
          - text: ", and related prompt files. It enables vi-style command-line editing, reverse history search with"
          - code [ref=e248]: Ctrl + R
          - text: ", and prompt/alias loading. These personal choices do not affect Hornero’s CLI contract."
        - paragraph [ref=e249]:
          - text: That profile also sets
          - code [ref=e250]: $EDITOR
          - text: and
          - code [ref=e251]: $VISUAL
          - text: to Neovim for command-line programs. Hornero itself has no universal graphical editor default; see
          - link "Default applications" [ref=e252] [cursor=pointer]:
            - /url: /docs/applications/default-apps/
          - text: . To run desktop tasks from a shell, use
          - link [ref=e253] [cursor=pointer]:
            - /url: /docs/desktop/horneroctl/
            - code [ref=e254]: horneroctl
          - text: and its installed
          - code [ref=e255]: "--help"
          - text: output.
        - heading "Optional tmux setup" [level=2] [ref=e256]
        - paragraph [ref=e257]:
          - text: The personal workstation configuration includes tmux and plugins; neither is required by Hornero. Its configuration uses
          - code [ref=e258]: Ctrl + A
          - text: as the primary prefix,
          - code [ref=e259]: Ctrl + B
          - text: as an alternate prefix, mouse support, vi-style copy-mode, and a large scrollback history. Plugin installation depends on the optional TPM checkout. See the
          - link "tmux manual" [ref=e260] [cursor=pointer]:
            - /url: https://github.com/tmux/tmux/wiki
          - text: before copying those preferences to another machine.
        - heading "When something does not open" [level=2] [ref=e261]
        - list [ref=e262]:
          - listitem [ref=e263]:
            - text: Run
            - code [ref=e264]: horneroctl apps launch --list
            - text: to see which launch backends are available.
          - listitem [ref=e265]:
            - text: Run
            - code [ref=e266]: horneroctl apps terminal-file --help
            - text: to inspect the Yazi workflow.
          - listitem [ref=e267]:
            - text: Check that the selected terminal is installed and that the
            - code [ref=e268]: TerminalEmulator
            - text: helper in
            - code [ref=e269]: ~/.config/xfce4/helpers.rc
            - text: matches it.
          - listitem [ref=e270]:
            - text: If a terminal’s colors are stale, apply the desired appearance again in
            - strong [ref=e271]: Settings → Appearance
            - text: and check
            - code [ref=e272]: horneroctl appearance colors status
            - text: .
          - listitem [ref=e273]:
            - text: Check whether a user-level config overrides the Hornero system fallback. For Ghostty, confirm
            - code [ref=e274]: theme = Hornero Dynamic
            - text: is present in the active
            - code [ref=e275]: config.ghostty
            - text: file.
