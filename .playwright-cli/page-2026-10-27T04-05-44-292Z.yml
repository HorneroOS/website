    - region [ref=f1e236]:
      - generic [ref=f1e237]:
        - heading "History, with sources" [level=2] [ref=f1e238]
        - paragraph [ref=f1e239]: Hornero started as one person’s daily desktop and later became separate projects. Each step after the first links to the commit or tag that dates it. The first step predates public history and rests on the maintainer’s account.
      - region "HorneroOS timeline, 2018 to 2026" [ref=f1e240]:
        - list [ref=f1e241]:
          - listitem [ref=f1e242]:
            - time [ref=f1e243]: "2018"
            - heading "A personal Arch Linux workstation" [level=3] [ref=f1e244]
            - paragraph [ref=f1e245]: Hornero starts as one developer’s daily desktop in Argentina. This stage predates the public repository history below, so it rests on the maintainer’s account.
            - generic [ref=f1e246]: Maintainer’s account · no public commit predates 2019
          - listitem [ref=f1e247]:
            - time [ref=f1e248]: 2019.11.02
            - heading "The configuration goes public" [level=3] [ref=f1e249]
            - paragraph [ref=f1e250]: "The first public commit of the dotfiles that became HorneroConfig: an i3 setup, followed the same day by Polybar."
            - link "First commit in ulises-jeremias/dotfiles" [ref=f1e251] [cursor=pointer]:
              - /url: https://github.com/ulises-jeremias/dotfiles/commit/40480e3419b62fedd2f41fcb649fd3df30ac1ab7
              - text: First commit in ulises-jeremias/dotfiles ↗
          - listitem [ref=f1e252]:
            - time [ref=f1e253]: 2026.02.27
            - heading "The shell becomes Quickshell" [level=3] [ref=f1e254]
            - paragraph [ref=f1e255]: The workstation switches its bars and panels to a Quickshell shell adapted from Caelestia Shell. That is a new chapter, not the 2018 setup unchanged.
            - link "Transition to Quickshell in dotfiles" [ref=f1e256] [cursor=pointer]:
              - /url: https://github.com/ulises-jeremias/dotfiles/commit/4f53f3e41cd47aeeb3235224ab922c092c856a22
              - text: Transition to Quickshell in dotfiles ↗
          - listitem [ref=f1e257]:
            - time [ref=f1e258]: 2026.09.10
            - heading "HorneroOS gets its own repositories" [level=3] [ref=f1e259]
            - paragraph [ref=f1e260]: The shell is imported from dotfiles into HorneroOS/shell with the upstream author, license and every header intact, then stripped of workstation-only paths.
            - link "Shell import, with the Caelestia NOTICE" [ref=f1e261] [cursor=pointer]:
              - /url: https://github.com/HorneroOS/shell/commit/5830eab60f913668b07e6314f5051b8957a2cd71
              - text: Shell import, with the Caelestia NOTICE ↗
          - listitem [ref=f1e262]:
            - time [ref=f1e263]: 2026.09.10
            - heading "horneroctl, the native system CLI" [level=3] [ref=f1e264]
            - paragraph [ref=f1e265]: A command-line core written in V becomes the operating-system contract. The shell calls its verbs instead of workstation scripts from 2026-09-29.
            - link "horneroctl core in HorneroOS/hornero" [ref=f1e266] [cursor=pointer]:
              - /url: https://github.com/HorneroOS/hornero/commit/45876631e2abb3180aa648ab1d425b4594b4deb9
              - text: horneroctl core in HorneroOS/hornero ↗
          - listitem [ref=f1e267]:
            - time [ref=f1e268]: 2026.10.01
            - heading "A QA repository records evidence" [level=3] [ref=f1e269]
            - paragraph [ref=f1e270]: HorneroOS/qa boots virtual machines, drives scenarios and keeps screenshots with hashes and the pinned product revisions.
            - link "Bootstrap of HorneroOS/qa" [ref=f1e271] [cursor=pointer]:
              - /url: https://github.com/HorneroOS/qa/commit/447f5b4e367dcb153215630e6669e4983da39473
              - text: Bootstrap of HorneroOS/qa ↗
          - listitem [ref=f1e272]:
            - time [ref=f1e273]: 2026.10.20
            - heading "An official extensions catalogue" [level=3] [ref=f1e274]
            - paragraph [ref=f1e275]: Official plugins get a catalogue with checksums and declared permissions. Community packages stay inert.
            - link "Marketplace foundation in HorneroOS/plugins" [ref=f1e276] [cursor=pointer]:
              - /url: https://github.com/HorneroOS/plugins/commit/4a17b450dbd01d15ecf16fc06608c69af704aaa5
              - text: Marketplace foundation in HorneroOS/plugins ↗
